name: Buscar nuevos negocios

on:
  schedule:
    - cron: "17 6,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar, puntuar y enviar alertas
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: cncatt.09@gmail.com
        run: python src/radar.py
      - name: Guardar nuevos datos
        run: |
          git config user.name "milan-lead-radar[bot]"
          git config user.email "milan-lead-radar[bot]@users.noreply.github.com"
          git add data docs/leads.json
          git diff --cached --quiet || git commit -m "data: actualizar prospectos"
          git push

